<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内部对象</title>
</head>
<body>
    <script>
        console.log(Math.floor(1.9));//向下取整
        console.log(Math.round(1.9));//四舍五入
        console.log(Math.ceil(1.1));//向上取整
        console.log(Math.floor(Math.random() * 101));////随机数[0,100]取整
        //随机数[min,max]取整
        // function randomNum(min,max){
        //     return Math.floor(Math.random() * (max - min + 1) + min);
        // }
        //Date对象
        var date = new Date();
        console.log(date.getFullYear());//获取年份
        console.log(date.getMonth()+1);//获取月份0-11所以要加1
        console.log(date.getDate());//获取日期
        console.log(date.getDay());//获取星期几0-6 0代表星期天
        //获取时、分、秒
        console.log(date.getHours()+":"+date.getMinutes()+":"+date.getSeconds());
        console.log(date.getTime());//获取时间戳,1970年1月1日到现在的毫秒数
        //数组
        var arr = [1,2,3,4,5，6，'seven','eight','nine','ten'];
        var arr1 = new Array(1,2,3,4,5,6,'seven','eight','nine','ten');
        var arr2 = new Array(5);//创建一个长度为5的数组
        

    </script>
</body>
</html>d
