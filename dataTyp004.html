<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据类型和运算符</title>
    <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
            max-width: 600px;
            margin: 30px auto;
        }

        .grid div {
            padding: 15px;
            text-align: center;
            font-size: 18px;
            border-radius: 6px;
        }

        /* 棋盘交替颜色，写在style里 */
        .grid div:nth-child(odd) {
            background-color: #ffd6a5;
        }

        .grid div:nth-child(even) {
            background-color: #90e0ef;
        }

        /* 需要剔除的数字，直接隐藏 */
        .hide {
            visibility: hidden;
        }
    </style>
</head>

<body>
    <div class="grid">
    </div>
    <script>
        var a = 10, b = 4;
        //控制台输出
        console.log(a++);
        console.log(a - b > 0 ? a : b);
        console.log(true && false, true || false, !true);
        var str = "hello world", num = 10, ble = true,
            ud, boj = { name: "张三", age: 20 }, arr = [1, 2, 3, 4, 5];
        console.log(typeof str, typeof num, typeof ble, typeof ud, typeof boj, typeof arr);
        //浮点小数不能用来做精确计算
        //JS不能用==或者===来判断两个浮点数是否相等
        console.log(0.1 + 0.2 == 0.3);
        //字符类型转换，+将数字转换为字符串，-用能用于数值运算
        console.log('1' + 1, 1 - '1', '11' + 1 - 1);
        //NaN表示不是一个数字，isNaN()函数判断是否是一个数字
        //NaN和任何值进行比较都是不相等，包括NaN本身
        console.log("wangyao" - 1);
        console.log(NaN == NaN);
        //parseInt()向下取整
        console.log(parseInt('12.9'));

        var grid = document.querySelector('.grid');
        //循环1~100，全部生成格子，DOM 100个div全部存在！
        for (var i = 1; i <= 100; i++) {
            var cell = document.createElement('div');
            cell.textContent = i;
            //符合条件就添加hide类，样式在style里面
            if (i % 7 == 0 || i.toString().indexOf('7') != -1) {
                cell.className = "hide";
            }
            grid.appendChild(cell);
        }
    </script>
</body>

</html>
